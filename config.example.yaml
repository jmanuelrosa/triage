# Triage — example config
#
# Copy to ~/.config/triage/config.yaml:
#   mkdir -p ~/.config/triage && cp config.example.yaml ~/.config/triage/config.yaml
#
# Reload after edits via the menu bar (or kill & relaunch Triage).
# Match semantics:
#   - First matching rule wins, top-down.
#   - host / path / source_app / cwd are independently optional. Missing field
#     = match anything.
#   - host and path support `*` glob (case-insensitive, anchored).
#   - source_app matches against either the bundle ID or the app's display name.
#   - cwd matches the working directory of the process that produced the URL.
#     Supports `~` and `*`. Resolved from /usr/bin/open's parent (terminal
#     invocations) and, for loopback URLs, from the process listening on the
#     URL's TCP port — so dev-server auto-opens like `http://localhost:3000/`
#     route correctly. Loopback URLs need an explicit port for the port-based
#     resolution to work. Built-in loopback hosts: `localhost`, `127.0.0.1`,
#     `::1`, plus anything ending in `.local`, `.localhost`, or `.test`. For
#     bare hostnames you've put in /etc/hosts (e.g. `my-test-app`), add them
#     to `loopback_aliases` below.
# No `default_browser` field — the silent fallback is whatever the system default
# browser was at Triage's first launch (captured to ~/.config/triage/fallback-browser.json).

# Optional. Hostnames you want treated as loopback for cwd-port resolution,
# in addition to the built-in matches. Useful for /etc/hosts aliases and
# company-internal dev hostnames that don't end in .local/.localhost/.test.
# Comparison is case-insensitive and matches the full host (not a suffix).
#
# loopback_aliases:
#   - my-test-app
#   - acme-dev

browsers:
  helium:
    bundle_id: net.imput.helium                # work / Acme
  chrome_personal:
    bundle_id: com.google.Chrome
    profile: "Jose Manuel"                     # → Default
  chrome_dev:
    bundle_id: com.google.Chrome
    profile: "Jose Manuel [Dev]"               # → Profile 4
  chrome_3bits:
    bundle_id: com.google.Chrome
    profile: "3bitslost"                       # → Profile 8

rules:
  # Work — anything Acme-related goes to Helium regardless of source
  - host: "*.acme.io"
    browser: helium
  - host: "*.globex.com"
    browser: helium
  - host: gitlab.com
    path: "/acme/*"
    browser: helium

  # GitHub orgs — same host, different routing by path
  - host: github.com
    path: "/globex/*"
    browser: helium
  - host: github.com
    path: "/3bitslost-team/*"
    browser: chrome_3bits

  # Source-app shortcut: work Slack → work browser, regardless of URL
  - source_app: Slack
    browser: helium

  # Terminal / dev-server routing by working directory: anything launched from
  # a work checkout (including loopback URLs from `npm run dev` etc.) → work
  # browser.
  - cwd: "~/Developer/work/*"
    browser: helium
